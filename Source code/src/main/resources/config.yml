# PureAuth v4.0 Configuration
# SzymeX Dev Studio

database:
  type: "SQLITE" # Options: SQLITE, MYSQL
  mysql:
    host: "localhost"
    port: 3306
    database: "minecraft"
    username: "root"
    password: "password"
    table_prefix: "pureauth_"

settings:
  # SAFE MODE: If true, sensitive admin commands are console-only.
  safe_mode: false

  # Language: "EN" or "PL"
  language: "EN"
  
  # Blindness effect on join (Ghost Mode visual)
  blindness_effect: true
  
  # --- PREMIUM AUTO-LOGIN ---
  # IP-Trust based. No ProtocolLib required.
  premium_login:
    enabled: true
    # Security: Only auto-login if the IP matches the last saved IP.
    require_same_ip: true

  # --- BACKUP SYSTEM (Missing in previous config) ---
  # Automatically saves database.db or exports MySQL data.
  backup:
    enabled: true
    interval_hours: 24
    max_backups: 10

  # --- DISCORD WEBHOOKS ---
  discord:
    enabled: false
    webhook_url: "YOUR_WEBHOOK_HERE"
    events:
      server_lifecycle: true
      user_login: false
      user_register: true
      user_changepass: true
      user_premium_toggle: true
      failed_attempts: true
      account_locked: true
      admin_usage: true
      admin_sensitive: true

  # --- SECURITY (Account Locking) ---
  security:
    account_lock_enabled: true
    kicks_before_lock: 3

  # --- CAPTCHA ---
  captcha:
    enabled: true
    length: 5
    characters: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"

  # --- LIMITS ---
  login_timeout: 60
  max_attempts: 3
  min_password_length: 4
  max_accounts_per_ip: 3
  
  # --- SESSIONS ---
  sessions:
    enabled: true
    time_minutes: 1

  # --- LOCATIONS (Do not edit manually) ---
  locations:
    spawn_login: ""
    spawn_register: ""

